[mgr]
title_format = "yazi {cwd}"

[preview]
image_delay = 0

[[plugin.prepend_preloaders]]
mime = "application/krita"
run = "krita"

[[plugin.prepend_preloaders]]
mime = "image/webp"
run = "magick"

[[plugin.prepend_preloaders]]
mime = "image/adobe.photoshop"
run = "psd"

[[plugin.prepend_previewers]]
mime = "application/krita"
run = "krita"

[[plugin.prepend_previewers]]
mime = "image/webp"
run = "magick"

[[plugin.prepend_previewers]]
mime = "image/adobe.photoshop"
run = "psd"

[[plugin.prepend_fetchers]]
id    = "mime" # Remove if Yazi > v26.1.22
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
id    = "mime" # Remove if Yazi > v26.1.22
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
id   = "git"
name = "*"
run  = "git"

[[plugin.prepend_fetchers]]
id   = "git"
name = "*/"
run  = "git"
