[mgr]
title_format = "yazi {cwd}"

[preview]
image_delay = 0

[[plugin.prepend_preloaders]]
mime = "application/krita"
run = "krita"

[[plugin.prepend_preloaders]]
mime = "image/webp"
run = "magick"

[[plugin.prepend_preloaders]]
mime = "image/adobe.photoshop"
run = "psd"

[[plugin.prepend_previewers]]
mime = "application/krita"
run = "krita"

[[plugin.prepend_previewers]]
mime = "image/webp"
run = "magick"

[[plugin.prepend_previewers]]
mime = "image/adobe.photoshop"
run = "psd"

[[plugin.prepend_fetchers]]
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
group = "git"
url   = "local://*"
run   = "git"

[[plugin.prepend_fetchers]]
group = "git"
url   = "local://*"
run   = "git"
